<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTM mobile assessment QA comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; background: #ede9e2; color: #101828; font: 14px Inter, system-ui, sans-serif; }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 24px; color: #667085; }
      main { display: flex; align-items: flex-start; gap: 20px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 10px; font-weight: 700; }
      .source-crop { position: relative; width: 121px; height: 250px; overflow: hidden; background: #fff; }
      .source-crop img { position: absolute; top: 0; left: -125px; width: 375px; height: 250px; max-width: none; }
      .implementation { display: block; width: 115px; height: 250px; object-fit: contain; background: #fff; }
    </style>
  </head>
  <body>
    <h1>Canonical company-assessment comparison</h1>
    <p>Approved middle-phone source crop and 1:1 protected-runtime implementation capture.</p>
    <main>
      <figure>
        <figcaption>Approved reference</figcaption>
        <div class="source-crop"><img src="/docs/images/conversational-gtm-prototype.png" alt="Approved three-state prototype board" /></div>
      </figure>
      <figure>
        <figcaption>Rendered implementation</figcaption>
        <img class="implementation" src="/docs/qa/implementation-phone-final-v2.png" alt="Rendered company assessment screen" />
      </figure>
    </main>
  </body>
</html>
